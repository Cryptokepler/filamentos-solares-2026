<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de filamentos</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #f5a524; --sel: #23293a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; }
  aside { width: 270px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  aside header { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  h1 { font-size: 15px; margin: 0; }
  select, input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: inherit; }
  .row { display: flex; gap: 6px; }
  #lista { flex: 1; overflow-y: auto; }
  #lista div { padding: 5px 12px; cursor: pointer; display: flex; justify-content: space-between; color: var(--muted); border-bottom: 1px solid #1d2129; }
  #lista div:hover { background: #1d2230; }
  #lista div.sel { background: var(--sel); color: var(--text); border-left: 3px solid var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #barra { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #barra label { display: flex; gap: 5px; align-items: center; color: var(--muted); }
  #barra select { width: auto; }
  .chips { display: flex; gap: 4px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 12px; padding: 3px 10px; cursor: pointer; }
  .chip.on { color: #111; background: var(--accent); border-color: var(--accent); }
  #lienzo { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  #lienzo.drag { cursor: grabbing; }
  canvas { position: absolute; inset: 0; }
  #info { position: absolute; left: 10px; bottom: 10px; background: rgba(15,17,21,.88); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 360px; pointer-events: none; }
  #info b { color: var(--accent); }
  #tip { position: absolute; pointer-events: none; background: rgba(0,0,0,.85); border-radius: 6px; padding: 4px 8px; display: none; white-space: nowrap; }
  #ayuda { color: var(--muted); padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12px; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
  .leyenda { display: flex; gap: 10px; }
  .leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; background: var(--c); vertical-align: -1px; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>☀️ Visor de filamentos</h1>
    <div class="row">
      <select id="split"><option value="train">Entrenamiento</option><option value="examen">Examen de la red</option><option value="test">Test</option></select>
      <select id="filtroAnot" title="Número de anotadores">
        <option value="0">Todos</option><option value="1">1 anotador</option><option value="2">2 anotadores</option><option value="3">3 anotadores</option>
      </select>
    </div>
    <div class="row">
      <select id="filtroObs" title="Observatorio (letra del nombre)"><option value="">Observatorio: todos</option></select>
      <select id="filtroAnio" title="Año"><option value="">Año: todos</option></select>
    </div>
    <input id="buscar" type="text" placeholder="Buscar por nombre…">
    <div id="conteo" style="color:var(--muted)"></div>
  </header>
  <div id="lista"></div>
  <div id="ayuda">
    <kbd>←</kbd><kbd>→</kbd> imagen · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> anotador · <kbd>A</kbd> todos<br>
    <kbd>H</kbd> ocultar máscaras · <kbd>S</kbd> espinas · <kbd>R</kbd> red · <kbd>0</kbd> reencuadrar<br>
    Rueda = zoom · arrastrar = mover
  </div>
</aside>
<main>
  <div id="barra">
    <div class="chips" id="anotadores"></div>
    <label>Color
      <select id="modoColor">
        <option value="filamento">por filamento</option>
        <option value="categoria">por quiralidad</option>
        <option value="anotador">por anotador</option>
      </select>
    </label>
    <label>Relleno <input id="opacidad" type="range" min="0" max="80" value="30"></label>
    <label><input id="verEspinas" type="checkbox"> Espinas</label>
    <label><input id="verMascaras" type="checkbox" checked> Máscaras</label>
    <label id="etqRed" style="color:#ff3dff"><input id="verRed" type="checkbox" checked> Red</label>
    <label>Contraste <input id="contraste" type="range" min="50" max="300" value="100"></label>
    <div class="leyenda" id="leyenda"></div>
  </div>
  <div id="lienzo">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="info"></div>
  </div>
</main>

<script src="data.js"></script>
<script>
const D = window.DATA;
const CAT_COLOR = { 1: "#4da3ff", 2: "#ff5d73", 3: "#f5d547", 4: "#b48cff" };
const ANOT_COLOR = ["#00e5a0", "#ff7a3d", "#4da3ff"];
const COLOR_RED = "#ff3dff";
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

const estado = {
  split: "train", items: [], idx: 0, img: null, anot: "todos",
  zoom: 1, ox: 0, oy: 0, hover: null, paths: [], acuerdo: null,
};

// ---------- lista y filtros ----------
function conAnot() { return estado.split !== "test"; }
function nombreDe(item) { return conAnot() ? item.n : item; }
function obsDe(n) { return n[14]; }
function anioDe(n) { return n.slice(0, 4); }

function rellenarFiltros() {
  const todos = [...D.train.map(i => i.n), ...D.test];
  const obs = [...new Set(todos.map(obsDe))].sort();
  const anios = [...new Set(todos.map(anioDe))].sort();
  for (const o of obs) $("filtroObs").add(new Option("Observatorio " + o, o));
  for (const a of anios) $("filtroAnio").add(new Option(a, a));
}

function filtrar() {
  estado.split = $("split").value;
  const fa = +$("filtroAnot").value, fo = $("filtroObs").value, fy = $("filtroAnio").value;
  const q = $("buscar").value.trim();
  const base = estado.split === "test" ? D.test
    : estado.split === "examen" ? D.train.filter(i => i.red).sort((a, b) => a.red.pq - b.red.pq) : D.train;
  estado.items = base.filter(it => {
    const n = nombreDe(it);
    if (fo && obsDe(n) !== fo) return false;
    if (fy && anioDe(n) !== fy) return false;
    if (q && !n.includes(q)) return false;
    if (fa && conAnot() && it.r.length !== fa) return false;
    return true;
  });
  $("filtroAnot").disabled = !conAnot();
  $("conteo").textContent = estado.items.length + " imágenes" + (estado.split === "examen" ? " (de peor a mejor nota de la red)" : "");
  if (estado.split === "examen" && !base.length) $("conteo").textContent = "No hay predicciones: pon predicciones_examen.json en visor/ y vuelve a ejecutar build_visor.py";
  const lista = $("lista");
  lista.innerHTML = "";
  estado.items.forEach((it, i) => {
    const d = document.createElement("div");
    const n = nombreDe(it);
    d.innerHTML = `<span>${n.replace(".jpeg", "")}</span><span>${estado.split === "examen" ? "PQ " + it.red.pq.toFixed(2) : conAnot() ? it.r.map(r => r.f.length).join(" / ") : ""}</span>`;
    d.onclick = () => cargar(i);
    lista.appendChild(d);
  });
  cargar(0);
}

// ---------- carga de imagen ----------
function cargar(i) {
  if (!estado.items.length) { ctx.clearRect(0, 0, cv.width, cv.height); $("info").innerHTML = "Sin imágenes con estos filtros"; return; }
  estado.idx = Math.max(0, Math.min(i, estado.items.length - 1));
  [...$("lista").children].forEach((d, j) => d.classList.toggle("sel", j === estado.idx));
  $("lista").children[estado.idx]?.scrollIntoView({ block: "nearest" });
  const it = estado.items[estado.idx];
  const n = nombreDe(it);
  const dir = conAnot() ? D.train_dir : D.test_dir;
  const img = new Image();
  img.onload = () => { estado.img = img; reencuadrar(); };
  img.onerror = () => { $("info").innerHTML = "No se pudo abrir " + dir + "/" + n; };
  img.src = dir + "/" + n;
  estado.anot = "todos";
  pintarChips();
  estado.acuerdo = conAnot() && it.r.length > 1 ? calcularAcuerdo(it.r) : null;
}

function registrosVisibles() {
  if (!conAnot()) return [];
  const regs = estado.items[estado.idx].r.map((r, k) => ({ ...r, k }));
  if (estado.anot === "todos") return regs;
  return regs.filter(r => r.k === estado.anot);
}

function pintarChips() {
  const cont = $("anotadores");
  cont.innerHTML = "";
  if (!conAnot()) return;
  const regs = estado.items[estado.idx].r;
  const opciones = regs.length > 1 ? ["todos", ...regs.map((_, k) => k)] : [0];
  if (regs.length === 1) estado.anot = 0;
  for (const o of opciones) {
    const b = document.createElement("span");
    b.className = "chip" + (estado.anot === o ? " on" : "");
    b.textContent = o === "todos" ? "Todos" : `Anotador ${o + 1} (${regs[o].f.length})`;
    b.onclick = () => { estado.anot = o; pintarChips(); dibujar(); };
    cont.appendChild(b);
  }
}

// ---------- vista ----------
function redimensionar() {
  const r = $("lienzo").getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
  dibujar();
}
function reencuadrar() {
  const s = Math.min(cv.width, cv.height) / 2048;
  estado.zoom = s; estado.ox = (cv.width - 2048 * s) / 2; estado.oy = (cv.height - 2048 * s) / 2;
  dibujar();
}

function colorDe(fil, j, reg) {
  const modo = $("modoColor").value;
  if (modo === "categoria") return CAT_COLOR[fil.c] || "#fff";
  if (modo === "anotador") return ANOT_COLOR[reg.k % 3];
  return `hsl(${(j * 137.5) % 360} 90% 60%)`;
}

function dibujar() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!estado.img) return;
  ctx.setTransform(estado.zoom, 0, 0, estado.zoom, estado.ox, estado.oy);
  ctx.filter = `contrast(${$("contraste").value}%)`;
  ctx.drawImage(estado.img, 0, 0, 2048, 2048);
  ctx.filter = "none";

  estado.paths = [];
  const alfa = $("opacidad").value / 100;
  const lw = 1.5 / estado.zoom;
  if ($("verMascaras").checked) {
    for (const reg of registrosVisibles()) {
      reg.f.forEach((fil, j) => {
        const path = new Path2D();
        for (const poly of fil.p) {
          path.moveTo(poly[0], poly[1]);
          for (let k = 2; k < poly.length; k += 2) path.lineTo(poly[k], poly[k + 1]);
          path.closePath();
        }
        const col = colorDe(fil, j, reg);
        const resaltado = estado.hover && estado.hover.fil === fil;
        ctx.globalAlpha = resaltado ? Math.min(1, alfa + 0.35) : alfa;
        ctx.fillStyle = col; ctx.fill(path);
        ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = resaltado ? lw * 2.5 : lw; ctx.stroke(path);
        estado.paths.push({ path, fil, reg, j });
        if ($("verEspinas").checked && fil.s.length > 3) {
          ctx.beginPath(); ctx.moveTo(fil.s[0], fil.s[1]);
          for (let k = 2; k < fil.s.length; k += 2) ctx.lineTo(fil.s[k], fil.s[k + 1]);
          ctx.strokeStyle = "#fff"; ctx.lineWidth = lw * 1.2; ctx.setLineDash([4 / estado.zoom, 3 / estado.zoom]); ctx.stroke(); ctx.setLineDash([]);
        }
      });
    }
  }
  const red = conAnot() && estado.items[estado.idx].red;
  if (red && $("verRed").checked) {
    red.f.forEach((fil, j) => {
      const path = new Path2D();
      for (const poly of fil.p) {
        path.moveTo(poly[0], poly[1]);
        for (let k = 2; k < poly.length; k += 2) path.lineTo(poly[k], poly[k + 1]);
        path.closePath();
      }
      const resaltado = estado.hover && estado.hover.fil === fil;
      ctx.strokeStyle = COLOR_RED; ctx.lineWidth = (resaltado ? 3.5 : 2) / estado.zoom;
      ctx.setLineDash([6 / estado.zoom, 4 / estado.zoom]); ctx.stroke(path); ctx.setLineDash([]);
      estado.paths.push({ path, fil, reg: { k: "red" }, j });
    });
  }
  pintarInfo();
  pintarLeyenda();
}

function pintarLeyenda() {
  const modo = $("modoColor").value, l = $("leyenda");
  if (modo === "categoria") l.innerHTML = Object.entries(D.categorias).map(([k, v]) => `<span style="--c:${CAT_COLOR[k]}">${v}</span>`).join("");
  else if (modo === "anotador") l.innerHTML = ANOT_COLOR.map((c, k) => `<span style="--c:${c}">Anot. ${k + 1}</span>`).join("");
  else l.innerHTML = "";
}

function pintarInfo() {
  const it = estado.items[estado.idx];
  const n = nombreDe(it);
  let h = `<b>${n}</b> · observatorio ${obsDe(n)} · ${n.slice(0, 4)}-${n.slice(4, 6)}-${n.slice(6, 8)} ${n.slice(8, 10)}:${n.slice(10, 12)}<br>`;
  if (conAnot()) {
    if (it.red) h += `<span style="color:${COLOR_RED}">Red (línea discontinua): ${it.red.f.length} filamentos · PQ <b>${it.red.pq.toFixed(2)}</b> · aciertos ${it.red.tp}, inventados ${it.red.fp}, se le escapan ${it.red.fn}</span><br>`;
    h += `${it.r.length} anotador(es): ${it.r.map(r => r.f.length).join(" / ")} filamentos`;
    if (estado.acuerdo) h += `<br>Acuerdo entre anotadores (PQ aprox.): ${estado.acuerdo.map(a => `${a.par} → <b>${a.pq.toFixed(2)}</b>`).join(" · ")}`;
  } else h += "Imagen de test (sin anotaciones)";
  $("info").innerHTML = h;
}

// ---------- acuerdo entre anotadores (PQ aproximada a 512 px) ----------
const R = 512, ESC = R / 2048;
const off = document.createElement("canvas"); off.width = off.height = R;
const octx = off.getContext("2d", { willReadFrequently: true });

function mascara(fil) {
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, R, R);
  octx.setTransform(ESC, 0, 0, ESC, 0, 0); octx.fillStyle = "#fff"; octx.beginPath();
  for (const p of fil.p) { octx.moveTo(p[0], p[1]); for (let k = 2; k < p.length; k += 2) octx.lineTo(p[k], p[k + 1]); octx.closePath(); }
  octx.fill();
  const [bx, by, bw, bh] = fil.b.map(v => v * ESC);
  const x0 = Math.max(0, Math.floor(bx) - 1), y0 = Math.max(0, Math.floor(by) - 1);
  const x1 = Math.min(R, Math.ceil(bx + bw) + 1), y1 = Math.min(R, Math.ceil(by + bh) + 1);
  const d = octx.getImageData(0, 0, R, R).data, set = new Set();
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (d[(y * R + x) * 4 + 3] > 127) set.add(y * R + x);
  return set;
}
function iou(a, b) { let i = 0; const [p, q] = a.size < b.size ? [a, b] : [b, a]; for (const v of p) if (q.has(v)) i++; const u = a.size + b.size - i; return u ? i / u : 0; }
function pq(A, B) {
  let tp = 0, suma = 0; const usadoB = new Set();
  for (const a of A) for (let j = 0; j < B.length; j++) {
    if (usadoB.has(j)) continue;
    const v = iou(a, B[j]);
    if (v > 0.5) { tp++; suma += v; usadoB.add(j); break; }
  }
  const fp = B.length - tp, fn = A.length - tp;
  return tp ? (suma / tp) * (tp / (tp + 0.5 * fp + 0.5 * fn)) : 0;
}
function calcularAcuerdo(regs) {
  const masks = regs.map(r => r.f.map(mascara));
  const out = [];
  for (let i = 0; i < regs.length; i++) for (let j = i + 1; j < regs.length; j++)
    out.push({ par: `${i + 1}↔${j + 1}`, pq: pq(masks[i], masks[j]) });
  return out;
}

// ---------- interacción ----------
let arrastre = null;
$("lienzo").addEventListener("mousedown", e => { arrastre = { x: e.clientX, y: e.clientY, ox: estado.ox, oy: estado.oy }; $("lienzo").classList.add("drag"); });
addEventListener("mouseup", () => { arrastre = null; $("lienzo").classList.remove("drag"); });
$("lienzo").addEventListener("mousemove", e => {
  const dpr = devicePixelRatio;
  if (arrastre) { estado.ox = arrastre.ox + (e.clientX - arrastre.x) * dpr; estado.oy = arrastre.oy + (e.clientY - arrastre.y) * dpr; dibujar(); return; }
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * dpr, py = (e.clientY - r.top) * dpr;
  ctx.setTransform(estado.zoom, 0, 0, estado.zoom, estado.ox, estado.oy);
  let hit = null;
  for (let k = estado.paths.length - 1; k >= 0; k--) if (ctx.isPointInPath(estado.paths[k].path, px, py)) { hit = estado.paths[k]; break; }
  const tip = $("tip");
  if (hit) {
    tip.style.display = "block"; tip.style.left = (e.clientX - r.left + 14) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px";
    tip.innerHTML = hit.reg.k === "red" ? `Red · filamento ${hit.j + 1}<br>${hit.fil.a.toLocaleString()} px`
      : `Anotador ${hit.reg.k + 1} · filamento ${hit.j + 1}<br>${D.categorias[hit.fil.c]} · ${hit.fil.a.toLocaleString()} px`;
  } else tip.style.display = "none";
  if ((hit && hit.fil) !== (estado.hover && estado.hover.fil)) { estado.hover = hit; dibujar(); }
});
$("lienzo").addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * devicePixelRatio, py = (e.clientY - r.top) * devicePixelRatio;
  const f = Math.exp(-e.deltaY * 0.0015);
  estado.ox = px - (px - estado.ox) * f; estado.oy = py - (py - estado.oy) * f; estado.zoom *= f;
  dibujar();
}, { passive: false });

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  const regs = conAnot() ? estado.items[estado.idx].r : [];
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { cargar(estado.idx + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { cargar(estado.idx - 1); e.preventDefault(); }
  else if (["1", "2", "3"].includes(e.key) && +e.key <= regs.length) { estado.anot = +e.key - 1; pintarChips(); dibujar(); }
  else if (e.key.toLowerCase() === "a" && regs.length > 1) { estado.anot = "todos"; pintarChips(); dibujar(); }
  else if (e.key.toLowerCase() === "h") { $("verMascaras").checked = !$("verMascaras").checked; dibujar(); }
  else if (e.key.toLowerCase() === "r") { $("verRed").checked = !$("verRed").checked; dibujar(); }
  else if (e.key.toLowerCase() === "s") { $("verEspinas").checked = !$("verEspinas").checked; dibujar(); }
  else if (e.key === "0") reencuadrar();
});

for (const id of ["modoColor", "opacidad", "verEspinas", "verMascaras", "verRed", "contraste"]) $(id).addEventListener("input", dibujar);
for (const id of ["split", "filtroAnot", "filtroObs", "filtroAnio"]) $(id).addEventListener("change", filtrar);
$("buscar").addEventListener("input", filtrar);
addEventListener("resize", redimensionar);

rellenarFiltros();
redimensionar();
filtrar();
</script>
</body>
</html>
